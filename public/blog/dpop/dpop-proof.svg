<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 556" width="1200" height="556" role="img" aria-labelledby="t d">
<title id="t">How a DPoP proof is tied to the access token</title>
<desc id="d">The proof JWT carries the public key in its jwk header and a hash of the access token in its ath claim. The access token carries the thumbprint of the same public key in cnf.jkt. The API accepts a request only when both links hold.</desc>
<style>
svg{--frame:#fafafa;--frame-line:#e5e5e5;--card:#ffffff;--line:#e5e5e5;--code:#f5f5f5;--fg:#171717;--muted:#737373;--subtle:#a3a3a3;--life:#d4d4d4;--acc:#2563eb;--acc-bg:#eff6ff;--acc-line:#bfdbfe;--red:#dc2626;--red-bg:#fef2f2;--green:#15803d;--green-bg:#f0fdf4}
@media (prefers-color-scheme: dark){svg{--frame:#111111;--frame-line:#262626;--card:#1a1a1a;--line:#2e2e2e;--code:#141414;--fg:#f5f5f5;--muted:#a3a3a3;--subtle:#737373;--life:#3a3a3a;--acc:#60a5fa;--acc-bg:#16233d;--acc-line:#1e3a8a;--red:#f87171;--red-bg:#2b1515;--green:#4ade80;--green-bg:#122318}}
text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--fg)}
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.muted{fill:var(--muted)}.subtle{fill:var(--subtle)}.acc{fill:var(--acc)}.red{fill:var(--red)}.green{fill:var(--green)}
.frame{fill:var(--frame);stroke:var(--frame-line)}
.card{fill:var(--card);stroke:var(--line)}
.node{fill:var(--frame);stroke:var(--line)}
.code{fill:var(--code);stroke:var(--line)}
.hl{fill:var(--acc-bg);stroke:var(--acc-line)}
.divider{stroke:var(--line)}
.life{stroke:var(--life);stroke-dasharray:4 4}
.req{stroke:var(--fg);fill:none}
.res{stroke:var(--muted);fill:none;stroke-dasharray:6 5}
.link{stroke:var(--acc);fill:none}
.mk-fg{stroke:var(--fg)}.mk-muted{stroke:var(--muted)}.mk-acc{stroke:var(--acc)}
.badge{fill:var(--fg)}.badge-text{fill:var(--card)}
.chip-red{fill:var(--red-bg)}.chip-green{fill:var(--green-bg)}
.label-bg{fill:var(--frame)}
</style>
<defs><marker id="h-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" class="mk-fg" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="h-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" class="mk-muted" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="h-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" class="mk-acc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="555" rx="12" class="frame"/>
<rect x="40" y="40" width="560" height="476" rx="10" class="card"/>
<text x="64" y="80" font-size="17" font-weight="600" xml:space="preserve">DPoP proof</text>
<text x="64" y="102" font-size="13" class="muted" xml:space="preserve">Signed by the browser, a new one for every request</text>
<line x1="40" y1="122" x2="600" y2="122" class="divider" stroke-width="1"/>
<text x="64" y="152" font-size="11" class="subtle" font-weight="600" letter-spacing="1.2" xml:space="preserve">HEADER</text>
<text x="64" y="180" font-size="14" class="mono" xml:space="preserve"><tspan class="muted">"typ"</tspan><tspan class="muted">: </tspan><tspan>"dpop+jwt"</tspan><tspan class="muted">,</tspan></text>
<text x="64" y="208" font-size="14" class="mono" xml:space="preserve"><tspan class="muted">"alg"</tspan><tspan class="muted">: </tspan><tspan>"ES256"</tspan><tspan class="muted">,</tspan></text>
<rect x="52" y="216" width="536" height="30" rx="6" class="hl"/>
<text x="64" y="236" font-size="14" class="mono" xml:space="preserve"><tspan class="muted">"jwk"</tspan><tspan class="muted">: </tspan><tspan class="acc">{ public key }</tspan><tspan class="muted"></tspan></text>
<text x="576" y="236" font-size="13" class="acc" text-anchor="end" xml:space="preserve">public key</text>
<text x="64" y="276" font-size="11" class="subtle" font-weight="600" letter-spacing="1.2" xml:space="preserve">PAYLOAD</text>
<text x="64" y="304" font-size="14" class="mono" xml:space="preserve"><tspan class="muted">"htm"</tspan><tspan class="muted">: </tspan><tspan>"GET"</tspan><tspan class="muted">,</tspan></text>
<text x="576" y="304" font-size="13" class="subtle" text-anchor="end" xml:space="preserve">HTTP method</text>
<text x="64" y="332" font-size="14" class="mono" xml:space="preserve"><tspan class="muted">"htu"</tspan><tspan class="muted">: </tspan><tspan>"http://localhost:8081/api/orders"</tspan><tspan class="muted">,</tspan></text>
<text x="576" y="332" font-size="13" class="subtle" text-anchor="end" xml:space="preserve">URL</text>
<text x="64" y="360" font-size="14" class="mono" xml:space="preserve"><tspan class="muted">"iat"</tspan><tspan class="muted">: </tspan><tspan>1794838800</tspan><tspan class="muted">,</tspan></text>
<text x="576" y="360" font-size="13" class="subtle" text-anchor="end" xml:space="preserve">issued at</text>
<text x="64" y="388" font-size="14" class="mono" xml:space="preserve"><tspan class="muted">"jti"</tspan><tspan class="muted">: </tspan><tspan>"b1f6c0c2-6c1e…"</tspan><tspan class="muted">,</tspan></text>
<text x="576" y="388" font-size="13" class="subtle" text-anchor="end" xml:space="preserve">unique id</text>
<rect x="52" y="396" width="536" height="30" rx="6" class="hl"/>
<text x="64" y="416" font-size="14" class="mono" xml:space="preserve"><tspan class="muted">"ath"</tspan><tspan class="muted">: </tspan><tspan class="acc">"fUHyO2r2Z3DZ…"</tspan><tspan class="muted"></tspan></text>
<text x="576" y="416" font-size="13" class="acc" text-anchor="end" xml:space="preserve">token hash</text>
<text x="64" y="456" font-size="11" class="subtle" font-weight="600" letter-spacing="1.2" xml:space="preserve">SIGNATURE</text>
<text x="64" y="484" font-size="13" class="muted" xml:space="preserve">ES256, signed with the browser's private key</text>
<rect x="800" y="150" width="360" height="276" rx="10" class="card"/>
<text x="824" y="190" font-size="17" font-weight="600" xml:space="preserve">Access token</text>
<text x="824" y="212" font-size="13" class="muted" xml:space="preserve">Issued by Keycloak</text>
<line x1="800" y1="232" x2="1160" y2="232" class="divider" stroke-width="1"/>
<text x="824" y="264" font-size="14" class="mono" xml:space="preserve"><tspan class="muted">"iss"</tspan><tspan class="muted">: </tspan><tspan>".../realms/demo"</tspan><tspan class="muted">,</tspan></text>
<text x="824" y="292" font-size="14" class="mono" xml:space="preserve"><tspan class="muted">"sub"</tspan><tspan class="muted">: </tspan><tspan>"5f1c…"</tspan><tspan class="muted">,</tspan></text>
<text x="824" y="320" font-size="14" class="mono" xml:space="preserve"><tspan class="muted">"exp"</tspan><tspan class="muted">: </tspan><tspan>1794839100</tspan><tspan class="muted">,</tspan></text>
<text x="824" y="348" font-size="14" class="mono" xml:space="preserve"><tspan class="muted">"cnf"</tspan><tspan class="muted">: {</tspan></text>
<rect x="812" y="356" width="336" height="30" rx="6" class="hl"/>
<text x="824" y="376" font-size="14" class="mono" xml:space="preserve"><tspan class="muted">  "jkt"</tspan><tspan class="muted">: </tspan><tspan class="acc">"0ZcOCORZNYy-DWpq…"</tspan><tspan class="muted"></tspan></text>
<text x="824" y="404" font-size="14" class="mono" xml:space="preserve"><tspan class="muted">}</tspan></text>
<path d="M596 231 C 700 231, 700 371, 804 371" class="link" stroke-width="1.5" marker-end="url(#h-acc)"/>
<rect x="636" y="279" width="128" height="46" rx="6" class="label-bg"/>
<text x="700" y="298" font-size="12" class="acc" font-weight="600" text-anchor="middle" xml:space="preserve">SHA-256</text>
<text x="700" y="315" font-size="12" class="muted" text-anchor="middle" xml:space="preserve">thumbprint</text>
<path d="M800 412 C 720 412, 680 411, 596 411" class="link" stroke-width="1.5" marker-end="url(#h-acc)"/>
<text x="700" y="440" font-size="12" class="muted" text-anchor="middle" xml:space="preserve">SHA-256 of this token</text>
<text x="980" y="470" font-size="13" class="muted" text-anchor="middle" xml:space="preserve">The API accepts the request only</text>
<text x="980" y="490" font-size="13" class="muted" text-anchor="middle" xml:space="preserve">when both links hold.</text>
</svg>
