<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="t d">
<title id="t">DPoP flow between an Angular SPA, Keycloak and a Spring Boot API</title>
<desc id="d">The SPA generates a key pair, sends a DPoP proof to Keycloak with the authorization code, receives an access token whose cnf.jkt claim holds the public key thumbprint, then calls the API with the token and a fresh proof. The API verifies the proof and that its key matches cnf.jkt.</desc>
<style>
svg{--frame:#fafafa;--frame-line:#e5e5e5;--card:#ffffff;--line:#e5e5e5;--code:#f5f5f5;--fg:#171717;--muted:#737373;--subtle:#a3a3a3;--life:#d4d4d4;--acc:#2563eb;--acc-bg:#eff6ff;--acc-line:#bfdbfe;--red:#dc2626;--red-bg:#fef2f2;--green:#15803d;--green-bg:#f0fdf4}
@media (prefers-color-scheme: dark){svg{--frame:#111111;--frame-line:#262626;--card:#1a1a1a;--line:#2e2e2e;--code:#141414;--fg:#f5f5f5;--muted:#a3a3a3;--subtle:#737373;--life:#3a3a3a;--acc:#60a5fa;--acc-bg:#16233d;--acc-line:#1e3a8a;--red:#f87171;--red-bg:#2b1515;--green:#4ade80;--green-bg:#122318}}
text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--fg)}
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.muted{fill:var(--muted)}.subtle{fill:var(--subtle)}.acc{fill:var(--acc)}.red{fill:var(--red)}.green{fill:var(--green)}
.frame{fill:var(--frame);stroke:var(--frame-line)}
.card{fill:var(--card);stroke:var(--line)}
.node{fill:var(--frame);stroke:var(--line)}
.code{fill:var(--code);stroke:var(--line)}
.hl{fill:var(--acc-bg);stroke:var(--acc-line)}
.divider{stroke:var(--line)}
.life{stroke:var(--life);stroke-dasharray:4 4}
.req{stroke:var(--fg);fill:none}
.res{stroke:var(--muted);fill:none;stroke-dasharray:6 5}
.link{stroke:var(--acc);fill:none}
.mk-fg{stroke:var(--fg)}.mk-muted{stroke:var(--muted)}.mk-acc{stroke:var(--acc)}
.badge{fill:var(--fg)}.badge-text{fill:var(--card)}
.chip-red{fill:var(--red-bg)}.chip-green{fill:var(--green-bg)}
.label-bg{fill:var(--frame)}
</style>
<defs><marker id="h-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" class="mk-fg" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="h-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" class="mk-muted" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="h-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" class="mk-acc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="779" rx="12" class="frame"/>
<line x1="200" y1="100" x2="200" y2="744" class="life" stroke-width="1"/>
<line x1="600" y1="100" x2="600" y2="744" class="life" stroke-width="1"/>
<line x1="1000" y1="100" x2="1000" y2="744" class="life" stroke-width="1"/>
<rect x="90" y="40" width="220" height="60" rx="8" class="card"/>
<text x="200" y="66" font-size="15" font-weight="600" text-anchor="middle" xml:space="preserve">Angular SPA</text>
<text x="200" y="86" font-size="12" class="muted" text-anchor="middle" xml:space="preserve">oidc-spa</text>
<rect x="490" y="40" width="220" height="60" rx="8" class="card"/>
<text x="600" y="66" font-size="15" font-weight="600" text-anchor="middle" xml:space="preserve">Keycloak</text>
<text x="600" y="86" font-size="12" class="muted" text-anchor="middle" xml:space="preserve">authorization server</text>
<rect x="890" y="40" width="220" height="60" rx="8" class="card"/>
<text x="1000" y="66" font-size="15" font-weight="600" text-anchor="middle" xml:space="preserve">Spring Boot API</text>
<text x="1000" y="86" font-size="12" class="muted" text-anchor="middle" xml:space="preserve">resource server</text>
<rect x="88" y="132" width="300" height="64" rx="8" class="card"/>
<circle cx="112" cy="156" r="11" class="badge"/><text x="112" y="160.5" font-size="12" class="badge-text" font-weight="600" text-anchor="middle" xml:space="preserve">1</text>
<text x="132" y="161" font-size="14" font-weight="600" xml:space="preserve">Generate a key pair</text>
<text x="132" y="182" font-size="13" class="muted" xml:space="preserve">The private key never leaves the browser</text>
<circle cx="236" cy="240" r="11" class="badge"/><text x="236" y="244.5" font-size="12" class="badge-text" font-weight="600" text-anchor="middle" xml:space="preserve">2</text>
<text x="256" y="245" font-size="14" font-weight="600" xml:space="preserve">Token request</text>
<text x="224" y="272" font-size="13" class="mono" xml:space="preserve"><tspan>code + PKCE verifier + </tspan><tspan class="acc">DPoP proof</tspan></text>
<line x1="200" y1="292" x2="597" y2="292" class="req" stroke-width="1.5" marker-end="url(#h-fg)"/>
<circle cx="236" cy="340" r="11" class="badge"/><text x="236" y="344.5" font-size="12" class="badge-text" font-weight="600" text-anchor="middle" xml:space="preserve">3</text>
<text x="256" y="345" font-size="14" font-weight="600" xml:space="preserve">Access token</text>
<text x="224" y="372" font-size="13" class="mono" xml:space="preserve"><tspan class="acc">cnf.jkt</tspan><tspan> = thumbprint(public key)</tspan></text>
<line x1="600" y1="392" x2="203" y2="392" class="res" stroke-width="1.5" marker-end="url(#h-muted)"/>
<circle cx="236" cy="440" r="11" class="badge"/><text x="236" y="444.5" font-size="12" class="badge-text" font-weight="600" text-anchor="middle" xml:space="preserve">4</text>
<text x="256" y="445" font-size="14" font-weight="600" xml:space="preserve">API call</text>
<text x="224" y="472" font-size="13" class="mono" xml:space="preserve"><tspan>Authorization: DPoP &lt;access token&gt;</tspan></text>
<text x="224" y="494" font-size="13" class="mono" xml:space="preserve"><tspan class="acc">DPoP: </tspan><tspan>&lt;proof for this method + URL&gt;</tspan></text>
<line x1="200" y1="514" x2="997" y2="514" class="req" stroke-width="1.5" marker-end="url(#h-fg)"/>
<rect x="812" y="546" width="340" height="98" rx="8" class="card"/>
<circle cx="836" cy="570" r="11" class="badge"/><text x="836" y="574.5" font-size="12" class="badge-text" font-weight="600" text-anchor="middle" xml:space="preserve">5</text>
<text x="856" y="575" font-size="14" font-weight="600" xml:space="preserve">Verify the request</text>
<text x="836" y="602" font-size="13" class="mono muted" xml:space="preserve">signature, htm, htu, ath</text>
<text x="836" y="624" font-size="13" class="mono" xml:space="preserve"><tspan class="muted">proof key == </tspan><tspan class="acc">cnf.jkt</tspan></text>
<circle cx="236" cy="686" r="11" class="badge"/><text x="236" y="690.5" font-size="12" class="badge-text" font-weight="600" text-anchor="middle" xml:space="preserve">6</text>
<text x="256" y="691" font-size="14" class="mono green" font-weight="600" xml:space="preserve">200 OK</text>
<line x1="1000" y1="712" x2="203" y2="712" class="res" stroke-width="1.5" marker-end="url(#h-muted)"/>
</svg>
