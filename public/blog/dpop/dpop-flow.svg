<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace">
<title id="t">DPoP flow between an Angular SPA, Keycloak and a Spring Boot API</title>
<desc id="d">The SPA generates a key pair, sends a DPoP proof to Keycloak with the authorization code, receives an access token whose cnf.jkt claim holds the public key thumbprint, then calls the API with the token and a fresh proof. The API verifies the proof and that its key matches cnf.jkt.</desc>
<defs>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3b82f6"/><stop offset="0.5" stop-color="#a855f7"/><stop offset="1" stop-color="#ef4444"/>
  </linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fafafa"/></marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker>
  <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker>
  <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a1a1a1"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1199" height="799" rx="16" fill="#0a0a0a" stroke="#2a2a2a"/>
<line x1="200" y1="112" x2="200" y2="760" stroke="#333" stroke-dasharray="4 6"/>
<line x1="600" y1="112" x2="600" y2="760" stroke="#333" stroke-dasharray="4 6"/>
<line x1="1000" y1="112" x2="1000" y2="760" stroke="#333" stroke-dasharray="4 6"/>
<rect x="70" y="40" width="260" height="72" rx="10" fill="#171717" stroke="#2a2a2a" stroke-width="1"/>
<text x="200" y="72" font-size="16" fill="#fafafa" text-anchor="middle" font-weight="600" >Angular SPA</text>
<text x="200" y="94" font-size="12" fill="#a1a1a1" text-anchor="middle" font-weight="400" >oidc-spa</text>
<rect x="470" y="40" width="260" height="72" rx="10" fill="#171717" stroke="#2a2a2a" stroke-width="1"/>
<text x="600" y="72" font-size="16" fill="#fafafa" text-anchor="middle" font-weight="600" >Keycloak</text>
<text x="600" y="94" font-size="12" fill="#a1a1a1" text-anchor="middle" font-weight="400" >authorization server</text>
<rect x="870" y="40" width="260" height="72" rx="10" fill="#171717" stroke="#2a2a2a" stroke-width="1"/>
<text x="1000" y="72" font-size="16" fill="#fafafa" text-anchor="middle" font-weight="600" >Spring Boot API</text>
<text x="1000" y="94" font-size="12" fill="#a1a1a1" text-anchor="middle" font-weight="400" >resource server</text>
<rect x="30" y="140" width="340" height="70" rx="10" fill="#111111" stroke="#3a3a3a" stroke-width="1"/>
<circle cx="56" cy="175.0" r="12" fill="#0a0a0a" stroke="url(#grad)" stroke-width="1.5"/><text x="56" y="179.5" font-size="12" fill="#fafafa" text-anchor="middle" font-weight="600" >1</text>
<text x="82" y="170" font-size="13" fill="#fafafa" text-anchor="start" font-weight="400" >generate key pair</text>
<text x="82" y="192" font-size="13" fill="#a1a1a1" text-anchor="start" font-weight="400" >private key stays in the browser</text>
<line x1="204" y1="300" x2="594" y2="300" stroke="#3b82f6" stroke-width="1.5"  marker-end="url(#arrowBlue)"/>
<rect x="273.2" y="254" width="253.60000000000002" height="34" rx="8" fill="#0a0a0a"/>
<circle cx="291.2" cy="271.0" r="12" fill="#0a0a0a" stroke="url(#grad)" stroke-width="1.5"/><text x="291.2" y="275.5" font-size="12" fill="#fafafa" text-anchor="middle" font-weight="600" >2</text>
<text x="315.2" y="278" font-size="13" fill="#fafafa" text-anchor="start" font-weight="400" >code + PKCE + DPoP proof</text>
<line x1="596" y1="390" x2="206" y2="390" stroke="#a1a1a1" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowMuted)"/>
<rect x="241.6" y="324" width="316.8" height="54" rx="8" fill="#0a0a0a"/>
<circle cx="259.6" cy="351.0" r="12" fill="#0a0a0a" stroke="url(#grad)" stroke-width="1.5"/><text x="259.6" y="355.5" font-size="12" fill="#fafafa" text-anchor="middle" font-weight="600" >3</text>
<text x="283.6" y="348" font-size="13" fill="#fafafa" text-anchor="start" font-weight="400" >access token</text>
<text x="283.6" y="368" font-size="13" fill="#a1a1a1" text-anchor="start" font-weight="400" >cnf.jkt = thumbprint(public key)</text>
<line x1="204" y1="500" x2="994" y2="500" stroke="#3b82f6" stroke-width="1.5"  marker-end="url(#arrowBlue)"/>
<rect x="429.75" y="434" width="340.5" height="54" rx="8" fill="#0a0a0a"/>
<circle cx="447.75" cy="461.0" r="12" fill="#0a0a0a" stroke="url(#grad)" stroke-width="1.5"/><text x="447.75" y="465.5" font-size="12" fill="#fafafa" text-anchor="middle" font-weight="600" >4</text>
<text x="471.75" y="458" font-size="13" fill="#fafafa" text-anchor="start" font-weight="400" >Authorization: DPoP &lt;access token&gt;</text>
<text x="471.75" y="478" font-size="13" fill="#a1a1a1" text-anchor="start" font-weight="400" >DPoP: &lt;proof for this method + URL&gt;</text>
<rect x="830" y="540" width="340" height="92" rx="10" fill="#111111" stroke="#3a3a3a" stroke-width="1"/>
<circle cx="856" cy="586.0" r="12" fill="#0a0a0a" stroke="url(#grad)" stroke-width="1.5"/><text x="856" y="590.5" font-size="12" fill="#fafafa" text-anchor="middle" font-weight="600" >5</text>
<text x="882" y="570" font-size="13" fill="#fafafa" text-anchor="start" font-weight="400" >verify the proof</text>
<text x="882" y="592" font-size="13" fill="#a1a1a1" text-anchor="start" font-weight="400" >signature, htm, htu, ath</text>
<text x="882" y="614" font-size="13" fill="#a1a1a1" text-anchor="start" font-weight="400" >proof key == cnf.jkt</text>
<line x1="996" y1="720" x2="206" y2="720" stroke="#a1a1a1" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowMuted)"/>
<rect x="544.3" y="674" width="111.4" height="34" rx="8" fill="#0a0a0a"/>
<circle cx="562.3" cy="691.0" r="12" fill="#0a0a0a" stroke="url(#grad)" stroke-width="1.5"/><text x="562.3" y="695.5" font-size="12" fill="#fafafa" text-anchor="middle" font-weight="600" >6</text>
<text x="586.3" y="698" font-size="13" fill="#fafafa" text-anchor="start" font-weight="400" >200 OK</text>
</svg>
