<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t d">
<title id="t">Replaying a stolen token: bearer versus DPoP</title>
<desc id="d">With a bearer token, an attacker who copies the token can call the API from their own machine and gets a 200. With a DPoP-bound token the attacker cannot sign a proof without the browser's private key, so the API answers 401.</desc>
<style>
svg{--frame:#fafafa;--frame-line:#e5e5e5;--card:#ffffff;--line:#e5e5e5;--code:#f5f5f5;--fg:#171717;--muted:#737373;--subtle:#a3a3a3;--life:#d4d4d4;--acc:#2563eb;--acc-bg:#eff6ff;--acc-line:#bfdbfe;--red:#dc2626;--red-bg:#fef2f2;--green:#15803d;--green-bg:#f0fdf4}
@media (prefers-color-scheme: dark){svg{--frame:#111111;--frame-line:#262626;--card:#1a1a1a;--line:#2e2e2e;--code:#141414;--fg:#f5f5f5;--muted:#a3a3a3;--subtle:#737373;--life:#3a3a3a;--acc:#60a5fa;--acc-bg:#16233d;--acc-line:#1e3a8a;--red:#f87171;--red-bg:#2b1515;--green:#4ade80;--green-bg:#122318}}
text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--fg)}
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.muted{fill:var(--muted)}.subtle{fill:var(--subtle)}.acc{fill:var(--acc)}.red{fill:var(--red)}.green{fill:var(--green)}
.frame{fill:var(--frame);stroke:var(--frame-line)}
.card{fill:var(--card);stroke:var(--line)}
.node{fill:var(--frame);stroke:var(--line)}
.code{fill:var(--code);stroke:var(--line)}
.hl{fill:var(--acc-bg);stroke:var(--acc-line)}
.divider{stroke:var(--line)}
.life{stroke:var(--life);stroke-dasharray:4 4}
.req{stroke:var(--fg);fill:none}
.res{stroke:var(--muted);fill:none;stroke-dasharray:6 5}
.link{stroke:var(--acc);fill:none}
.mk-fg{stroke:var(--fg)}.mk-muted{stroke:var(--muted)}.mk-acc{stroke:var(--acc)}
.badge{fill:var(--fg)}.badge-text{fill:var(--card)}
.chip-red{fill:var(--red-bg)}.chip-green{fill:var(--green-bg)}
.label-bg{fill:var(--frame)}
</style>
<defs><marker id="h-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" class="mk-fg" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="h-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" class="mk-muted" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="h-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" class="mk-acc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="479" rx="12" class="frame"/>
<rect x="40" y="40" width="540" height="400" rx="10" class="card"/>
<text x="68" y="82" font-size="17" font-weight="600" xml:space="preserve">Bearer token</text>
<text x="68" y="106" font-size="14" class="muted" xml:space="preserve">Works for whoever holds it</text>
<line x1="40" y1="130" x2="580" y2="130" class="divider" stroke-width="1"/>
<rect x="68" y="160" width="136" height="60" rx="8" class="node"/>
<text x="136" y="186" font-size="15" font-weight="600" text-anchor="middle" xml:space="preserve">Attacker</text>
<text x="136" y="206" font-size="12" class="muted" text-anchor="middle" xml:space="preserve">own machine</text>
<rect x="416" y="160" width="136" height="60" rx="8" class="node"/>
<text x="484" y="186" font-size="15" font-weight="600" text-anchor="middle" xml:space="preserve">API</text>
<text x="484" y="206" font-size="12" class="muted" text-anchor="middle" xml:space="preserve">Spring Boot</text>
<line x1="212" y1="190" x2="408" y2="190" class="req" stroke-width="1.5" marker-end="url(#h-fg)"/>
<text x="310" y="180" font-size="12" class="muted" text-anchor="middle" xml:space="preserve">replays the token</text>
<rect x="68" y="248" width="484" height="72" rx="8" class="code"/>
<text x="88" y="278" font-size="13" class="mono muted" xml:space="preserve">GET /api/orders</text>
<text x="88" y="302" font-size="13" class="mono" xml:space="preserve"><tspan>Authorization: Bearer &lt;stolen token&gt;</tspan></text>
<rect x="68" y="376" width="78.4" height="32" rx="6" class="chip-red"/>
<text x="82" y="397" font-size="14" class="mono red" font-weight="600" xml:space="preserve">200 OK</text>
<text x="160.4" y="397" font-size="14" xml:space="preserve">The attacker gets the data.</text>
<rect x="620" y="40" width="540" height="400" rx="10" class="card"/>
<text x="648" y="82" font-size="17" font-weight="600" xml:space="preserve">DPoP-bound token</text>
<text x="648" y="106" font-size="14" class="muted" xml:space="preserve">Bound to the browser's private key</text>
<line x1="620" y1="130" x2="1160" y2="130" class="divider" stroke-width="1"/>
<rect x="648" y="160" width="136" height="60" rx="8" class="node"/>
<text x="716" y="186" font-size="15" font-weight="600" text-anchor="middle" xml:space="preserve">Attacker</text>
<text x="716" y="206" font-size="12" class="muted" text-anchor="middle" xml:space="preserve">own machine</text>
<rect x="996" y="160" width="136" height="60" rx="8" class="node"/>
<text x="1064" y="186" font-size="15" font-weight="600" text-anchor="middle" xml:space="preserve">API</text>
<text x="1064" y="206" font-size="12" class="muted" text-anchor="middle" xml:space="preserve">Spring Boot</text>
<line x1="792" y1="190" x2="988" y2="190" class="req" stroke-width="1.5" marker-end="url(#h-fg)"/>
<text x="890" y="180" font-size="12" class="muted" text-anchor="middle" xml:space="preserve">replays the token</text>
<rect x="648" y="248" width="484" height="96" rx="8" class="code"/>
<text x="668" y="278" font-size="13" class="mono muted" xml:space="preserve">GET /api/orders</text>
<text x="668" y="302" font-size="13" class="mono" xml:space="preserve"><tspan>Authorization: DPoP &lt;stolen token&gt;</tspan></text>
<text x="668" y="326" font-size="13" class="mono" xml:space="preserve"><tspan>DPoP: </tspan><tspan class="red">&lt;cannot sign a proof&gt;</tspan></text>
<rect x="648" y="376" width="162.4" height="32" rx="6" class="chip-green"/>
<text x="662" y="397" font-size="14" class="mono green" font-weight="600" xml:space="preserve">401 Unauthorized</text>
<text x="824.4" y="397" font-size="14" xml:space="preserve">No private key, no proof, no access.</text>
</svg>
