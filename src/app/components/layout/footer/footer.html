<!-- Footer -->
<footer 
  class="relative min-h-[70vh] bg-zinc-950 overflow-hidden"
  (mouseenter)="onFooterEnter()"
  (mouseleave)="onFooterLeave()"
>
  <!-- Aurora gradient effects -->
  <div class="absolute inset-0 pointer-events-none">
    <!-- Blue glow -->
    <div class="aurora-gradient absolute top-1/4 left-1/3 w-64 h-96 bg-blue-600/40 blur-[100px] rounded-full"></div>
    <!-- Purple/pink vertical glows -->
    <div class="aurora-gradient absolute top-0 right-1/4 w-24 h-full bg-gradient-to-b from-purple-600/50 via-pink-500/30 to-transparent blur-[60px]"></div>
    <div class="aurora-gradient absolute top-0 right-[30%] w-16 h-3/4 bg-gradient-to-b from-pink-500/40 via-purple-600/30 to-transparent blur-[50px]"></div>
    <div class="aurora-gradient absolute top-1/4 right-[35%] w-20 h-2/3 bg-gradient-to-b from-purple-400/30 via-pink-500/20 to-transparent blur-[70px]"></div>
  </div>

  <div class="relative z-10 px-8 lg:px-16 py-16 h-full flex flex-col justify-between min-h-[70vh]">
    <!-- Top section -->
    <div class="flex flex-col lg:flex-row justify-between gap-12">
      <!-- Left: Navigation -->
      <nav class="flex flex-col gap-2">
        @for (link of navLinks(); track link.label) {
          <a 
            [href]="link.url" 
            (click)="onNavClick($event, link.url)"
            class="text-2xl lg:text-3xl font-medium text-white/90 hover:text-white transition-colors duration-300 tracking-tight"
          >
            {{ link.label }}
          </a>
        }
      </nav>

      <!-- Right: Contact & Socials -->
      <div class="flex flex-col sm:flex-row gap-12 lg:gap-24">
        <!-- Contact -->
        <div class="flex flex-col gap-4">
          <p class="text-md text-zinc-400 uppercase tracking-widest font-semibold">Contact</p>
          <div class="flex flex-col gap-1 text-sm text-zinc-300 font-medium">
            <a href="mailto:aziz.zina2001&#64;gmail.com" class="hover:text-white transition-colors">aziz.zina2001&#64;gmail.com</a>
            <a href="tel:+21654750526" class="hover:text-white transition-colors">+216 93 505 147</a>
            <span class="text-zinc-400">Tunisia</span>
          </div>
        </div>

        <!-- Socials -->
        <div class="flex flex-col gap-4">
          <p class="text-md text-zinc-400 uppercase tracking-widest font-semibold">Connect</p>
          <div class="flex flex-col gap-1 text-sm font-medium">
            @for (social of socials(); track social.label) {
              <a 
                [href]="social.url" 
                target="_blank" 
                rel="noopener noreferrer"
                class="text-zinc-300 hover:text-white transition-colors duration-300 flex items-center gap-1"
              >
                {{ social.label }}
              </a>
            }
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom section -->
    <div class="flex flex-col lg:flex-row justify-between items-end gap-8 mt-16">
      <!-- Large brand name -->
      <div class="flex items-end gap-1">
        <span class="text-[8rem] lg:text-[12rem] font-bold text-white leading-none tracking-tighter">
          AZ
        </span>
        <span class="text-white text-2xl mb-8 font-semibold">®</span>
      </div>

      <!-- Copyright -->
      <div class="text-right">
        <p class="text-xs text-zinc-400 uppercase tracking-widest font-semibold">
          {{ currentYear() }} © Aziz Zina. All<br/>Rights Reserved
        </p>
      </div>
    </div>
  </div>
</footer>
