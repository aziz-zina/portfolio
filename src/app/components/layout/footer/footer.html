<!-- Footer -->
<footer class="relative min-h-[70vh] bg-zinc-950 overflow-hidden">
  <!-- Aurora gradient effects -->
  <div class="absolute inset-0 pointer-events-none">
    <!-- Blue glow -->
    <div class="absolute top-1/4 left-1/3 w-64 h-96 bg-blue-600/40 blur-[100px] rounded-full"></div>
    <!-- Orange/amber vertical glows -->
    <div class="absolute top-0 right-1/4 w-24 h-full bg-gradient-to-b from-purple-600/50 via-pink-500/30 to-transparent blur-[60px]"></div>
    <div class="absolute top-0 right-[30%] w-16 h-3/4 bg-gradient-to-b from-pink-500/40 via-purple-600/30 to-transparent blur-[50px]"></div>
    <div class="absolute top-1/4 right-[35%] w-20 h-2/3 bg-gradient-to-b from-purple-400/30 via-pink-500/20 to-transparent blur-[70px]"></div>
  </div>

  <div class="relative z-10 px-8 lg:px-16 py-16 h-full flex flex-col justify-between min-h-[70vh]">
    <!-- Top section -->
    <div class="flex flex-col lg:flex-row justify-between gap-12">
      <!-- Left: Navigation -->
      <nav class="flex flex-col gap-2">
        @for (link of navLinks(); track link.label) {
          <a 
            [href]="link.url" 
            class="text-2xl lg:text-3xl font-light text-white/90 hover:text-white transition-colors duration-300 tracking-tight"
          >
            {{ link.label }}
          </a>
        }
      </nav>

      <!-- Right: Contact & Socials -->
      <div class="flex flex-col sm:flex-row gap-12 lg:gap-24">
        <!-- Contact -->
        <div class="flex flex-col gap-4">
          <h4 class="text-xs text-zinc-500 uppercase tracking-widest">Contact</h4>
          <div class="flex flex-col gap-1 text-sm text-zinc-300">
            <a href="mailto:aziz.zina2001&#64;gmail.com" class="hover:text-white transition-colors">aziz.zina2001&#64;gmail.com</a>
            <a href="tel:+21654750526" class="hover:text-white transition-colors">+216 54 750 526</a>
            <span class="text-zinc-500">Tunisia</span>
          </div>
        </div>

        <!-- Socials -->
        <div class="flex flex-col gap-4">
          <h4 class="text-xs text-zinc-500 uppercase tracking-widest">Connect</h4>
          <div class="flex flex-col gap-1 text-sm">
            @for (social of socials(); track social.label) {
              <a 
                [href]="social.url" 
                target="_blank" 
                rel="noopener noreferrer"
                class="text-zinc-300 hover:text-white transition-colors duration-300 flex items-center gap-1"
              >
                {{ social.label }}
                <span class="text-zinc-600 text-xs">↗</span>
              </a>
            }
          </div>
        </div>

        <!-- Newsletter -->
        <div class="flex flex-col gap-4">
          <h4 class="text-xs text-zinc-500 uppercase tracking-widest">Stay Updated</h4>
          <div class="flex gap-2">
            <input 
              type="email" 
              placeholder="Enter your email" 
              class="bg-transparent border-b border-zinc-700 text-sm text-white placeholder-zinc-600 py-2 px-0 w-40 focus:outline-none focus:border-zinc-400 transition-colors"
            />
            <button class="text-xs uppercase tracking-wider text-zinc-400 border border-zinc-700 px-4 py-2 hover:bg-white hover:text-black transition-all duration-300">
              Subscribe
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom section -->
    <div class="flex flex-col lg:flex-row justify-between items-end gap-8 mt-16">
      <!-- Large brand name -->
      <div class="flex items-end gap-1">
        <span class="text-[8rem] lg:text-[12rem] font-bold text-white leading-none tracking-tighter">
          AZ
        </span>
        <span class="text-white text-2xl mb-8">®</span>
      </div>

      <!-- Copyright -->
      <div class="text-right">
        <p class="text-xs text-zinc-500 uppercase tracking-widest">
          {{ currentYear() }} © Aziz Zina. All<br/>Rights Reserved
        </p>
      </div>
    </div>
  </div>
</footer>
