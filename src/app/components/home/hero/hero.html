<section class="sticky top-0 z-0 w-full h-screen overflow-hidden text-foreground bg-background">


  <!-- Social Sidebar -->
  <div class="absolute left-8 bottom-8 z-50 hidden md:flex opacity-0 hero-text-reveal">
    <app-social-sidebar />
  </div>

  <!-- Main Content -->
  <div class="absolute inset-0 flex flex-col items-center justify-center z-40 pointer-events-none">
    <div #heroText class="w-full max-w-5xl px-6 text-center">
      <p class="mb-5 font-mono text-sm md:text-base font-medium tracking-tight text-muted-foreground hero-text-reveal opacity-0">
        Hi! I'm Aziz
      </p>
      <h1 class="font-display text-4xl md:text-6xl lg:text-7xl font-extrabold tracking-[-0.04em] leading-[0.95] hero-text-reveal opacity-0">
        Full-stack
        <span class="font-accent text-[1.12em] font-normal italic tracking-[-0.02em]">Developer</span>
      </h1>
      <p class="mt-5 font-mono text-base md:text-xl lg:text-2xl font-medium tracking-tight text-muted-foreground hero-text-reveal opacity-0 flex items-center justify-center">
        <span class="typewriter-text"></span><span class="w-[0.55ch] h-[1.1em] bg-muted-foreground ml-1 hero-cursor"></span>
      </p>
    </div>
  </div>

  <!-- Planet ring, back half: behind the headline, over a soft glow (HeroScene adds the canvas) -->
  <div #canvasContainer class="absolute inset-0 z-30 opacity-0">
    <div class="pointer-events-none absolute inset-0 -z-10 grid place-items-center" aria-hidden="true">
      <div
        class="h-[42vh] w-[min(78vw,60rem)] rounded-full blur-3xl opacity-50 dark:opacity-70 bg-[radial-gradient(closest-side_at_32%_50%,rgb(49_133_255/0.45),transparent),radial-gradient(closest-side_at_68%_50%,rgb(252_65_62/0.4),transparent)]"
      ></div>
    </div>
  </div>

  <!-- Planet ring, front half: passes in front of the headline -->
  <div #canvasFront class="pointer-events-none absolute inset-0 z-[45] opacity-0" aria-hidden="true"></div>

  <!-- Scroll Indicator -->
  <app-scroll-indicator />
</section>
