<section class="relative w-full bg-background dark:bg-black z-10" id="projects-section" #section>
  <!-- Ambient Background -->
  <div
    class="absolute top-0 left-1/2 -translate-x-1/2 w-[1000px] h-[600px] bg-blue-500/10 blur-[120px] rounded-full pointer-events-none"
  ></div>
  <div
    class="absolute bottom-0 right-0 w-[800px] h-[800px] bg-purple-500/10 blur-[120px] rounded-full pointer-events-none"
  ></div>

  <!-- Section Header -->
  <div class="max-w-7xl mx-auto px-6 pt-24 pb-12 relative z-10">
    <app-section-title title="Selected Work" />
  </div>

  <!-- Split Layout Container -->
  <div class="max-w-7xl mx-auto px-6 relative z-10" #container>
    <div class="flex flex-col lg:flex-row relative min-h-screen">
      
      <!-- Left Column: Scrollable Content -->
      <div class="w-full lg:w-1/2 flex flex-col z-10" #leftColumn>
        @for (project of projects(); track $index) {
          <div 
            class="project-content flex flex-col justify-center min-h-screen px-4 lg:pr-16"
            [attr.data-index]="$index"
          >
            <div class="space-y-6">
              <span class="text-sm font-mono text-zinc-400 font-medium tracking-widest uppercase">
                {{ project.type }}
              </span>

              <h3 class="text-4xl md:text-5xl font-bold text-zinc-900 dark:text-zinc-50 leading-tight">
                {{ project.name }}
              </h3>

              <p class="text-lg md:text-xl text-zinc-500 dark:text-zinc-400 leading-relaxed max-w-xl">
                {{ project.description }}
              </p>

              <!-- Tech Stack -->
              <div class="flex flex-wrap gap-2 pt-2">
                @for (tech of project.techs; track $index) {
                  <span class="text-xs font-medium text-zinc-400 dark:text-zinc-500 border border-zinc-200 dark:border-zinc-800 px-2 py-1 rounded">
                    {{ tech }}
                  </span>
                }
              </div>

              <!-- Links -->
              <div class="pt-4 flex items-center gap-4">
                @if(project.website) {
                  <a [href]="project.website" target="_blank" hlmBtn variant="ghost" class="rounded-full px-0 hover:bg-transparent hover:text-blue-500 pl-0 gap-2">
                    Visit Site <ng-icon name="lucideExternalLink" size="sm" />
                  </a>
                }
                <button hlmBtn variant="ghost" size="icon" class="rounded-full hover:bg-transparent hover:text-black dark:hover:text-white">
                  <ng-icon name="lucideGithub" size="sm" />
                </button>
              </div>
            </div>

            <!-- Mobile Only: Inline Image -->
            <div class="lg:hidden mt-8 rounded-xl overflow-hidden shadow-lg">
              <div class="relative w-full aspect-[4/3] bg-[#1e1e1e] rounded-xl overflow-hidden">
                <div class="absolute top-0 w-full h-8 bg-[#2a2a2a] border-b border-zinc-800 flex items-center px-3 gap-1.5 z-10">
                  <div class="w-2.5 h-2.5 rounded-full bg-[#ff5f56]"></div>
                  <div class="w-2.5 h-2.5 rounded-full bg-[#ffbd2e]"></div>
                  <div class="w-2.5 h-2.5 rounded-full bg-[#27c93f]"></div>
                </div>
                <img 
                  [src]="project.image" 
                  [alt]="project.name"
                  class="object-cover w-full h-full pt-8"
                  loading="lazy"
                />
              </div>
            </div>
          </div>
        }
      </div>

      <!-- Right Column: Pinned Preview - Initially hidden at top of container -->
      <div 
        class="project-preview-wrapper hidden lg:block w-1/2 absolute top-0 right-0 h-screen pointer-events-none" 
        #previewWrapper
      >
        <div 
          class="project-preview-container w-full h-full flex items-center justify-center pointer-events-auto"
          #preview
        >
          <!-- Dark Window Frame -->
          <div class="relative w-full max-w-lg aspect-[4/3] rounded-2xl overflow-hidden shadow-2xl bg-[#1e1e1e] border border-zinc-800">
            
            <!-- Mac-style Window Controls -->
            <div class="absolute top-0 w-full h-10 bg-[#2a2a2a] border-b border-zinc-800 flex items-center px-4 gap-2 z-20">
              <div class="w-3 h-3 rounded-full bg-[#ff5f56]"></div>
              <div class="w-3 h-3 rounded-full bg-[#ffbd2e]"></div>
              <div class="w-3 h-3 rounded-full bg-[#27c93f]"></div>
              <div class="absolute inset-0 flex items-center justify-center text-[10px] font-mono text-zinc-500">
                {{ activeProjectName() }}
              </div>
            </div>

            <!-- Image Container -->
            <div class="relative w-full h-full pt-10 overflow-hidden">
              @for (project of projects(); track $index) {
                <div 
                  class="project-image absolute inset-0 w-full h-full pt-10"
                  [attr.data-index]="$index"
                >
                  <img 
                    [src]="project.image" 
                    [alt]="project.name"
                    class="object-cover w-full h-full"
                    loading="lazy"
                  />
                </div>
              }
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom spacer -->
  <div class="h-24"></div>
</section>
